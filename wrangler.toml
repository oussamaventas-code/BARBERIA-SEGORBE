name = "barberia-segorbe2"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# La web (dist/) y la API (/api/*) salen del mismo Worker: mismo dominio, cookies seguras.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "barberia"
database_id = "04af07bc-6801-40b8-91a4-e12dba258f1a"
migrations_dir = "migrations"
